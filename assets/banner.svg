<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#titleGrad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .tag {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    
    /* Dynamic floating particles in background */
    @keyframes float1 {
      0% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
      50% { transform: translateY(-15px) rotate(180deg); opacity: 0.7; }
      100% { transform: translateY(0px) rotate(360deg); opacity: 0.3; }
    }
    @keyframes float2 {
      0% { transform: translateY(0px) scale(1); opacity: 0.2; }
      50% { transform: translateY(20px) scale(1.1); opacity: 0.6; }
      100% { transform: translateY(0px) scale(1); opacity: 0.2; }
    }
    @keyframes pulseRing {
      0% { r: 70px; opacity: 0.6; }
      50% { r: 85px; opacity: 0.1; }
      100% { r: 70px; opacity: 0.6; }
    }

    .p1 { animation: float1 8s ease-in-out infinite; transform-origin: center; }
    .p2 { animation: float2 10s ease-in-out infinite; transform-origin: center; }
    .ring { animation: pulseRing 4s ease-in-out infinite; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Background Grid & Accents (Behind Text) -->
  <g opacity="0.1">
    <path d="M0 64H1200M0 128H1200M0 192H1200M0 256H1200" stroke="#94a3b8" stroke-width="1" />
    <path d="M150 0V320M300 0V320M450 0V320M600 0V320M750 0V320M900 0V320M1050 0V320" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- Dynamic / Animated Background Orbs (Behind Text & Elements) -->
  <g class="p1">
    <circle cx="980" cy="140" r="120" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
  </g>
  <g class="p2">
    <circle cx="1100" cy="220" r="90" fill="#0ea5e9" opacity="0.15" filter="url(#glow)" />
  </g>

  <!-- Right Side Decorative Graphic: Cloud & Shield Icon -->
  <g transform="translate(930, 80)">
    <circle class="ring" cx="80" cy="80" r="75" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" />
    
    <!-- Cloud Background -->
    <path d="M45 95 C 45 80, 60 70, 75 72 C 82 58, 102 58, 112 70 C 125 70, 135 80, 132 95 C 135 110, 120 120, 105 120 L 55 120 C 42 120, 35 110, 45 95 Z" 
          fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2" />
    
    <!-- Shield / Lock Symbol -->
    <path d="M80 50 L110 65 V95 C110 115 80 130 80 130 C80 130 50 115 50 95 V65 Z" 
          fill="#1e1b4b" stroke="#818cf8" stroke-width="2.5" opacity="0.9" />
    <path d="M73 85 L78 90 L88 78" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Foreground Content: Header Badge, Title, Subtitle (Guaranteed Unobscured) -->
  <g transform="translate(60, 65)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="230" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="115" y="19" class="tag" text-anchor="middle">⚡ CURATED AWESOME LIST</text>

    <!-- Main Title -->
    <text x="0" y="85" class="title">Awesome Cloud Backup &amp; Recovery ☁️</text>

    <!-- Subtitle -->
    <text x="0" y="125" class="subtitle">SaaS Platforms, Open-Source Tools, Disaster Recovery &amp; Data Resilience</text>

    <!-- Decorative Stat Pills -->
    <g transform="translate(0, 155)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="15" y="22" font-family="system-ui" font-size="13" fill="#cbd5e1" font-weight="600">🛡️ Zero Trust DR</text>

      <!-- Pill 2 -->
      <rect x="175" y="0" width="180" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="190" y="22" font-family="system-ui" font-size="13" fill="#cbd5e1" font-weight="600">🔐 Encrypted BYOS</text>

      <!-- Pill 3 -->
      <rect x="370" y="0" width="190" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="385" y="22" font-family="system-ui" font-size="13" fill="#cbd5e1" font-weight="600">📊 SaaS Pricing &amp; Free Tiers</text>
    </g>
  </g>
</svg>
